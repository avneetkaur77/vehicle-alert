<!DOCTYPE html>
<html>
<head>
    <title>Vehicle Alert</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background-color: #f5f5f5;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: inline-block;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .block {
            background-color: #ff4d4d;
            color: white;
        }

        .emergency {
            background-color: #ff9900;
            color: white;
        }

        .normal {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚗 Vehicle Alert</h1>
    <p>This vehicle seems to be blocking you.</p>

    <button class="block" onclick="sendAlert('blocking')">
        🚗 Blocking My Vehicle
    </button>

    <button class="emergency" onclick="sendAlert('emergency')">
        🚨 Emergency
    </button>

    <button class="normal" onclick="sendAlert('normal')">
        ⏳ Just Inform
    </button>
</div>

<<script type="module">
    // Import Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  
    // YOUR CONFIG (paste here)
    const firebaseConfig = {
        apiKey: "AIzaSyCJLaL4wMpI6p5vYiL-t2Wsgx1UxK6bu_k",
        authDomain: "vehicle-alert-94312.firebaseapp.com",
        projectId: "vehicle-alert-94312",
        storageBucket: "vehicle-alert-94312.firebasestorage.app",
        messagingSenderId: "899638186477",
        appId: "1:899638186477:web:4e5007e6817ba0fc5897e4",
        measurementId: "G-TZCT9BKJYW"
      };
    
  
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
  
    // Make function global
    window.sendAlert = async function(type) {
  
      let params = new URLSearchParams(window.location.search);
      let carId = params.get("id");
  
      if (!carId) {
        alert("No car ID found!");
        return;
      }
  
      // Fetch from Firebase
      const docRef = doc(db, "cars", carId);
      const docSnap = await getDoc(docRef);
  
      if (!docSnap.exists()) {
        alert("Car not found!");
        return;
      }
  
      let phoneNumber = docSnap.data().phone;
  
      let message = "";
  
      if (type === "blocking") {
        message = "Your car (" + carId + ") is blocking mine.";
      } else if (type === "emergency") {
        message = "URGENT for car (" + carId + ")";
      } else {
        message = "Info for car (" + carId + ")";
      }
  
      let link = "https://wa.me/" + phoneNumber + "?text=" + encodeURIComponent(message);
  
      window.open(link, "_blank");
    }
  </script>

</body>
</html>
