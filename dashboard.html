<!DOCTYPE html>
<html>
<head>
    <title>Owner Dashboard</title>
    <style>
        body {
            font-family: Arial;
            padding: 40px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .alert-box {
            background: white;
            padding: 15px;
            margin: 10px auto;
            max-width: 400px;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<h1>🚗 Vehicle Alerts Dashboard</h1>

<div id="alerts"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyCJLaL4wMpI6p5vYiL-t2Wsgx1UxK6bu_k",
  authDomain: "vehicle-alert-94312.firebaseapp.com",
  projectId: "vehicle-alert-94312",
  storageBucket: "vehicle-alert-94312.firebasestorage.app",
  messagingSenderId: "899638186477",
  appId: "1:899638186477:web:4e5007e6817ba0fc5897e4",
  measurementId: "G-TZCT9BKJYW"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Get carId from URL
let params = new URLSearchParams(window.location.search);
let carId = params.get("id");

if (!carId) {
    document.body.innerHTML = "<h2>No Car ID provided</h2>";
}

// Fetch alerts
const querySnapshot = await getDocs(collection(db, "alerts"));

let container = document.getElementById("alerts");

querySnapshot.forEach((doc) => {
    let data = doc.data();

    if (data.carId === carId) {

        let div = document.createElement("div");
        div.className = "alert-box";

        div.innerHTML = `
            <b>Type:</b> ${data.type} <br>
            <b>Time:</b> ${new Date(data.time.seconds * 1000).toLocaleString()}
        `;

        container.appendChild(div);
    }
});

</script>

</body>
</html>
